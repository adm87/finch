application:
  title: "Finch"
  tick_rate: 60

  screen:
    width: 1280
    height: 720
    fullscreen: false

  # Bundles loaded when the game starts. They stay loaded for the whole game.
  bundles:
    - filesystem: embedded
      assets:
        - embedded/configs/aseprite_config.yaml
        - embedded/images/default_10x10.png

rendering:
  clear_color: "#6495EDFF"
