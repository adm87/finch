fps: 60

window:
  width: 1280
  height: 720
  fullscreen: false

rendering:
  clear_color: "#000000FF"

# Resource bundles that will be loaded when the game starts.
# These assets are loaded once and remain available throughout the game.
static_content:
  - filesystem: embedded
    assets: 
      - embedded/configs/aseprite_config.yaml
      - embedded/images/default_10x10.png