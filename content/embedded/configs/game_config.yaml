# The buffer the game draws into.
application:
  screen:
    width: 1280
    height: 720

engine:
  title: "Finch"
  tick_rate: 60
  clear_color: "#6495EDFF"
  window:
    width: 1280
    height: 720
    fullscreen: false
    resizable: true

# Bundles loaded when the game starts. They stay loaded for the whole session.
bundles:
  - filesystem: embedded
    assets:
      - embedded/images/default_10x10.png
