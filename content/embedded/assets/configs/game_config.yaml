# The buffer the game draws into.
screen:
  width: 640
  height: 360

engine:
  title: "Finch"
  tick_rate: 60
  clear_color: "#6495EDFF"
  window:
    width: 1280
    height: 720
    fullscreen: false
    resizable: true
    resolution_scale: 0.5
    screen_filter: 0

# Content loaded together from one source: "embedded" (built into the binary)
# or "disk" (content/resources).
bundles:
  startup:
    source: embedded
    images:
      - images/default_10x10.png
  gym:
    source: disk
    maps:
      - gym04
    libraries:
      - captain

# Bundles loaded before the first scene. They stay loaded for the whole session.
startup:
  - startup
