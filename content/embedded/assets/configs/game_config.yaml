# The buffer the game draws into.
screen:
  width: 640
  height: 360

engine:
  title: "Finch"
  tick_rate: 60
  clear_color: "#6495EDFF"
  window:
    width: 1280
    height: 720
    fullscreen: false
    resizable: true
    resolution_scale: 0.5
    screen_filter: 0

# Bundles loaded when the game starts. They stay loaded for the whole session.
bundles:
  - filesystem: images
    assets:
      - default_10x10.png
